<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CFV</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">CFV <span class="slogan">put yourself in a flash disk</span> <span id="synth" class="tag" hidden>örnek veri</span></div>
  <nav class="tabs">
    <button data-tab="tl" class="on">Zaman çizgisi</button>
    <button data-tab="mx">Eşleşmeler <span id="badge" class="badge" hidden></span></button>
  </nav>
  <div class="search">
    <input id="q" type="search" placeholder="Kişi ara ya da tarih: 2024-07" autocomplete="off" aria-label="Ara">
    <div id="sr" class="dropdown" hidden></div>
  </div>
  <div id="filters" class="filters" aria-label="Türler"></div>
  <form method="post" action="/logout" class="logout"><button class="ghost" title="Çıkış">Çıkış</button></form>
</header>

<main>
  <section id="tl" class="view">
    <canvas id="cv"></canvas>
    <div id="tip" class="tip" hidden></div>
    <div id="span" class="span-label"></div>
    <div class="hint">tekerlek: yakınlaş · sürükle: kaydır · tıkla: ayrıntı · çift tık: o döneme in</div>
  </section>

  <section id="mx" class="view" hidden>
    <div class="mx-wrap">
      <div class="mx-head">
        <h2>Eşleşmeler</h2>
        <p class="muted">Aynı insanın farklı kaynaklardaki kayıtları. Kararlar ayrı dosyada tutulur, yeni veri gelince korunur; her karar geri alınabilir.</p>
        <div id="mx-seg" class="seg"></div>
      </div>
      <div id="mx-list"></div>
      <h3 class="mx-h3">Karar geçmişi</h3>
      <div id="mx-hist"></div>
    </div>
  </section>

  <aside id="panel" class="panel" hidden>
    <button id="pclose" class="pclose" aria-label="Kapat">×</button>
    <div id="pbody"></div>
  </aside>
  <div id="lightbox" class="lightbox" hidden><img alt=""></div>
</main>
<script src="/static/d3-force.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
