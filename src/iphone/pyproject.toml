[project]
name = "cfv-iphone"
version = "0.1.0"
description = "CFV: iPhone şifreli Wi-Fi yedeği → ham görüntü → çözülmüş çıkarım (cfv-iphone)"
requires-python = ">=3.12"
# Sürümler SABİT (server-main şartı); hash'ler uv.lock'ta. Ana CFV bağımlılıklarına girmez.
dependencies = [
    "iphone-backup-decrypt==0.11.2",   # şifreli yedeği çözme (MIT)
    "pymobiledevice3==11.49.1",        # yalnız bir kez: lockdown wifi-connections on (+ B planı)
    "pyliblzfse==0.4.1",               # _tools/photos_meta.py (OCR blob'ları LZFSE)
    "pycryptodome==4.4.0",             # cfv-zepp giriş gövdesi AES-CBC (zaten kilitte, iphone-backup-decrypt üzerinden)
]

[project.scripts]
cfv-iphone = "cfv_iphone.cli:main"
cfv-zepp = "cfv_iphone.zepp:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfv_iphone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
