# sabah.tunapro.xyz — TASLAK (cfv-iphone, 2026-11-15). Kurulum, DNS ve reload: server-main (ada). PLAN cfv/iphone §9.2.
# Uygulama: cfv-sabah.service, 127.0.0.1:3070. Dışarı YALNIZ POST /sabah/v1; gerisi 404.
# Kimlik: uygulamada Bearer token (sabit zamanlı). nginx: HTTPS, deneme sınırı, noindex, gövde 256k.
# GÜVENLİK: gövde kişisel sağlık verisi ve rüya metni taşır → access_log KAPALI. error_log ayrı tanımlanmıyor ki
#   limit_req retleri /var/log/nginx/error.log'a düşsün ve mevcut [nginx-limit-req] fail2ban hapsi devreye girsin.
# DNS: *.tunapro.xyz joker. Sertifika: joker (snippets/tunapro-ssl.conf). sms.tunapro.xyz taslağı örnek alındı.

limit_req_zone $binary_remote_addr zone=cfv_sabah:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sabah.tunapro.xyz;
    include /etc/nginx/snippets/tunapro-ssl.conf;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    access_log off;
    client_max_body_size 256k;
    server_tokens off;
    limit_req_status 429;

    location = /sabah/v1 {
        limit_except POST { deny all; }
        limit_req zone=cfv_sabah burst=5 nodelay;
        proxy_pass http://127.0.0.1:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
    }

    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name sabah.tunapro.xyz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
