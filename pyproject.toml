[project]
name = "cfv"
version = "0.0.1"
description = "Central Finite Vault — kişisel hayat verisi için yerel zaman çizelgesi + MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "icalendar>=7.3.0",
    "mcp>=2.3.0",
    "recurring-ical-events>=3.8.2",
]

[project.scripts]
cfv = "cfv.cli:main"
cfv-mcp = "cfv.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
